[project]
name = "payflow"
version = "0.1.0"
description = "Digital wallet backend: double-entry ledger, idempotent transfers, outbox worker."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "asyncpg>=0.32",
    "fastapi>=0.143",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "prometheus-client>=0.26",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyjwt>=2.15",
    "redis>=8.1",
    "sqladmin>=0.32",
    "sqlalchemy[asyncio]>=2.0.44,<2.1",
    "structlog>=26.1",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "testcontainers>=4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payflow", "src/mock_provider"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "ERA",
    "I",
    "N",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"loadtest/**" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["payflow", "mock_provider"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "sqlalchemy.orm.declared_attr",
    "sqlalchemy.orm.declared_attr.directive",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "alembic"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["payflow", "mock_provider"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
