name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.1"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: payflow
          POSTGRES_DB: payflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payflow -d payflow_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://payflow:payflow@localhost:5432/payflow_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.1"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=term-missing --durations=10
      - if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --detach
      - name: wait for the api
        run: >-
          curl --fail --silent --show-error --retry 30 --retry-delay 2
          --retry-all-errors http://localhost:8000/health
      - name: log in as a seeded user
        run: >-
          curl --fail --silent --show-error -X POST http://localhost:8000/api/v1/auth/login
          -H "Content-Type: application/json"
          -d '{"phone": "+77010000001", "password": "demo-pass-123"}'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
